name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to complete
        required: true
        type: string

permissions:
  contents: write

jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify release identity and module
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.[0-9]$ ]]
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          test "$(cat .kombify/VERSION)" = "$version"
          go mod verify
          go test ./...
          go build ./...
      - name: Render canonical release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v heading="## [$version]" '
            $0 == heading || index($0, heading " - ") == 1 { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
      - name: Create or verify public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists for the verified tag."
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --prerelease \
              --title "kombify Go Common $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
